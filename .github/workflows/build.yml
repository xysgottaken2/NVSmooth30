name: CI build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-dll:
    name: Windows / MSVC version.dll + probe + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cmake --version
          python --version
        shell: cmd

      - name: Configure (x64, Release-capable, tests + probe)
        run: cmake -S . -B build -A x64 -DNVS30_BUILD_TESTS=ON
        shell: cmd

      - name: Build Release (FAILS the job if the DLL does not compile)
        run: |
          cmake --build build --config Release -- /v:minimal /nologo /m > build-output.txt 2>&1 || (type build-output.txt & echo BUILD-FAILED & exit /b 1)
          type build-output.txt
          echo BUILD-OK
        shell: cmd

      - name: Upload build output (always, so CI errors are readable without logs access)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-output-${{ github.run_id }}
          path: build-output.txt
          if-no-files-found: ignore

      - name: Unit tests (portable fatbin engine, no GPU required)
        run: ctest --test-dir build -C Release --output-on-failure
        shell: cmd

      - name: Repository invariant checks
        run: python tools\validate_project.py
        shell: cmd

      - name: Python tool smoke
        run: |
          python -m py_compile tools\inspect_nvp.py tools\validate_project.py tools\make_fixtures.py
          python tools\inspect_nvp.py --help > nul
          echo inspector-usage-ok
        shell: cmd

      - name: Package artifact
        run: |
          mkdir package
          copy build\Release\version.dll package\version.dll
          copy build\Release\nvs30_probe.exe package\nvs30_probe.exe
          copy /y build\Release\version.pdb package\ > nul 2>&1 || echo (pdb optional)
          copy examples\run_probe_rtx2060.bat package\run_probe_rtx2060.bat
          copy README.md package\README.md
          mkdir package\docs
          copy docs\SM75_PORT.md package\docs\SM75_PORT.md
          powershell -NoProfile -Command "Compress-Archive -Path package\* -DestinationPath nvsmooth30-windows-x64.zip -Force"
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: nvsmooth30-windows-x64
          path: nvsmooth30-windows-x64.zip
          if-no-files-found: error

  linux-portable-tests:
    name: Linux / portable fatbin core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (tests-only on non-Windows hosts)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
        shell: bash

      - name: Build
        run: cmake --build build -j
        shell: bash

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
        shell: bash

  python-tools:
    name: Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check tools
        run: python -m py_compile tools/*.py
        shell: bash
      - name: Repository invariants
        run: python tools/validate_project.py
        shell: bash
      - name: CMake source paths exist
        run: |
          python - <<'PY'
          import re, pathlib
          root = pathlib.Path(".")
          cmake = (root / "CMakeLists.txt").read_text()
          missing = [p for p in re.findall(r"\b(?:src|include|tests|tools)/[A-Za-z0-9_./-]+\.(?:cpp|hpp|def)", cmake)
                     if not (root / p).is_file()]
          assert not missing, f"missing CMake sources: {missing}"
          print("all CMake-listed sources present")
          PY
        shell: bash
